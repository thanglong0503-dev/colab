name: Tự động cập nhật dữ liệu FinceptTerminal

# Lên lịch chạy tự động (Cron job)
on:
  schedule:
    # Chạy vào 15:15 chiều giờ Việt Nam (Tức 08:15 UTC), từ Thứ 2 đến Thứ 6
    - cron: '15 8 * * 1-5'
  
  # Cho phép Ngài bấm nút chạy thủ công bất cứ lúc nào
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Cài đặt Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện (Dependencies)
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy gspread oauth2client vnstock==0.2.9.2.2 tqdm beautifulsoup4

    - name: Khôi phục File Credentials từ Két sắt
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: |
        echo "$GCP_CREDENTIALS" > credentials.json

    - name: Kích hoạt Bot chạy dữ liệu
      run: |
        python main.py

    - name: Dọn dẹp dấu vết (Xóa credentials)
      if: always()
      run: |
        rm -f credentials.json
